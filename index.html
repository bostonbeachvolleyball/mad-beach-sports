<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAD Beach Sports | Make A Day</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --teal: #2c9c9c;
      --dark-teal: #176b6b;
      --sand: #f7f1e5;
      --cream: #fffdf8;
      --navy: #173b3b;
      --orange: #ef8354;
      --light-teal: #dff3f1;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background: var(--cream);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
      background: var(--cream);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #e8e1d5;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--teal);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 15px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: var(--teal);
    }

    /* HERO */

    .hero {
      background: var(--teal);
      color: white;
      padding: 110px 6% 100px;
      text-align: center;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(58px, 10vw, 120px);
      line-height: 0.9;
      letter-spacing: -6px;
      margin-bottom: 28px;
    }

    .hero p {
      font-size: 21px;
      max-width: 650px;
      margin: 0 auto 35px;
    }

    .button {
      display: inline-block;
      background: white;
      color: var(--dark-teal);
      padding: 15px 25px;
      border-radius: 999px;
      font-weight: 800;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    /* SECTIONS */

    section {
      padding: 85px 6%;
    }

    .section-title {
      font-size: 42px;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .section-intro {
      max-width: 650px;
      color: #557070;
      margin-bottom: 35px;
      font-size: 18px;
    }

    /* TOURNAMENT CARD */

    .featured {
      background: var(--sand);
    }

    .tournament-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      max-width: 1100px;
      margin: 35px auto 0;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      box-shadow: 0 12px 40px rgba(23, 59, 59, 0.08);
    }

    .tournament-image {
      background: var(--orange);
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
      text-align: center;
    }

    .tournament-image h3 {
      font-size: 52px;
      line-height: 1;
      letter-spacing: -3px;
    }

    .tournament-info {
      padding: 45px;
    }

    .tournament-info h3 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    .details {
      display: grid;
      gap: 13px;
      margin: 25px 0;
    }

    .detail {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .detail-icon {
      font-size: 20px;
      width: 28px;
    }

    .register-button {
      display: inline-block;
      background: var(--teal);
      color: white;
      padding: 15px 24px;
      border-radius: 999px;
      font-weight: 800;
      margin-top: 10px;
    }

    /* FORMAT CARDS */

    .formats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 1100px;
      margin: 35px auto 0;
    }

    .format-card {
      background: var(--light-teal);
      padding: 38px;
      border-radius: 22px;
    }

    .format-card h3 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .format-card p {
      color: #466363;
    }

    .about {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }
